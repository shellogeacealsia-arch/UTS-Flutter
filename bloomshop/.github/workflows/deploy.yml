
name: Deploy BloomShop to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ambil dependencies
        run: flutter pub get

      - name: Build website
        run: flutter build web --release --base-href /UTS-Flutter/

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publikasikan website
        id: deployment
        uses: actions/deploy-pages@v4
